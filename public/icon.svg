<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent -->
  <path d="M64 256 H448 M256 64 V448" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  
  <!-- Central Building & Key Concept -->
  <g filter="url(#shadow)" transform="translate(40, 20)">
    <!-- Main Skyscraper Silhouette -->
    <rect x="180" y="110" width="130" height="250" rx="14" fill="#1e293b" stroke="#334155" stroke-width="6"/>
    <!-- Left Building -->
    <path d="M100 200 L170 170 V360 H100 Z" fill="#0f172a" stroke="#334155" stroke-width="5"/>
    <!-- Windows Matrix -->
    <rect x="202" y="138" width="22" height="28" rx="4" fill="url(#goldGrad)" opacity="0.9"/>
    <rect x="238" y="138" width="22" height="28" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="202" y="180" width="22" height="28" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="238" y="180" width="22" height="28" rx="4" fill="url(#goldGrad)" opacity="0.9"/>
    <rect x="202" y="222" width="22" height="28" rx="4" fill="url(#goldGrad)" opacity="0.9"/>
    <rect x="238" y="222" width="22" height="28" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="202" y="264" width="22" height="28" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="238" y="264" width="22" height="28" rx="4" fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Shield / Modern Roof Badge -->
    <path d="M150 140 L245 70 L340 140 L340 210 Q245 280 150 210 Z" fill="url(#accentGrad)" opacity="0.95"/>
    <path d="M245 110 L290 145 V185 Q245 225 200 185 V145 Z" fill="#ffffff" opacity="0.92"/>
    <path d="M235 155 L245 140 L255 155 L265 140 V175 H225 V140 Z" fill="url(#accentGrad)"/>
    
    <!-- Dynamic Checkmark of Verification -->
    <circle cx="310" cy="330" r="42" fill="#10b981" stroke="#0f172a" stroke-width="6"/>
    <path d="M294 330 L305 341 L328 318" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
